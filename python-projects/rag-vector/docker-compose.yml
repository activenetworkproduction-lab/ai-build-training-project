services:
  postgres:
    # pgvector/pgvector 镜像 = 官方 Postgres + 预装好的 pgvector 扩展，
    # 不需要自己编译扩展，拉起来就能用 `CREATE EXTENSION vector;`
    image: pgvector/pgvector:pg16
    container_name: rag-vector-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_vector
    ports:
      # 本机 5432 端口已被占用，改用 5532 映射到容器内的标准 5432
      - '5532:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
